name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: twitch-miner-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: twitch-miner-linux-aarch64
          - os: windows-latest
            asset: twitch-miner-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Rename binary
        shell: bash
        run: |
          bin=target/release/twitch-miner
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          mkdir dist
          cp "$bin" "dist/${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Arrange binaries per Docker platform
        run: |
          mkdir -p ctx/bin/amd64 ctx/bin/arm64
          cp artifacts/twitch-miner-linux-x86_64/twitch-miner-linux-x86_64 ctx/bin/amd64/twitch-miner
          cp artifacts/twitch-miner-linux-aarch64/twitch-miner-linux-aarch64 ctx/bin/arm64/twitch-miner
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/twitch-miner-rs
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: .github/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
